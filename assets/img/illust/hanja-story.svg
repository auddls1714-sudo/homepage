<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="스토리 연상 예시: 나무 목(木), 수풀 림(林), 수풀 삼(森)">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".08"/>
    </filter>
    <g id="tree">
      <rect x="-3" y="10" width="6" height="16" rx="2" fill="#8a6a4a"/>
      <path d="M0-22 L18 6 H-18 Z" fill="#34a853"/>
      <path d="M0-32 L14-8 H-14 Z" fill="#4cc26b"/>
    </g>
    <style>
      .k { font-family: "Batang", "Noto Serif KR", "Noto Serif CJK KR", "Songti SC", serif; font-size: 112px; fill: #1d1d1f; text-anchor: middle; }
      .t { font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif; font-size: 22px; font-weight: 700; fill: #1d1d1f; text-anchor: middle; }
      .s { font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif; font-size: 16px; fill: #6e6e73; text-anchor: middle; }
      .n { font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif; font-size: 14px; font-weight: 700; fill: #0066cc; text-anchor: middle; }
    </style>
  </defs>
  <rect width="960" height="400" rx="28" fill="#f5f5f7"/>

  <!-- 카드 1: 木 -->
  <g transform="translate(70 40)">
    <rect width="230" height="320" rx="22" fill="#fff" filter="url(#sh)"/>
    <text class="n" x="115" y="36">STORY 1</text>
    <use href="#tree" x="115" y="88"/>
    <text class="k" x="115" y="236">木</text>
    <text class="t" x="115" y="276">나무 목</text>
    <text class="s" x="115" y="302">나무 한 그루</text>
  </g>

  <!-- 화살표 -->
  <g fill="#0066cc"><circle cx="330" cy="200" r="20"/><path d="M324 190l12 10-12 10" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>

  <!-- 카드 2: 林 -->
  <g transform="translate(365 40)">
    <rect width="230" height="320" rx="22" fill="#fff" filter="url(#sh)"/>
    <text class="n" x="115" y="36">STORY 2</text>
    <use href="#tree" x="92" y="88"/><use href="#tree" x="138" y="88"/>
    <text class="k" x="115" y="236">林</text>
    <text class="t" x="115" y="276">수풀 림</text>
    <text class="s" x="115" y="302">나무 두 그루가 모이면 숲</text>
  </g>

  <g fill="#0066cc"><circle cx="625" cy="200" r="20"/><path d="M619 190l12 10-12 10" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>

  <!-- 카드 3: 森 -->
  <g transform="translate(660 40)">
    <rect width="230" height="320" rx="22" fill="#0066cc" filter="url(#sh)"/>
    <text class="n" x="115" y="36" style="fill:#cfe6ff">STORY 3</text>
    <use href="#tree" x="115" y="70"/><use href="#tree" x="90" y="100"/><use href="#tree" x="140" y="100"/>
    <text class="k" x="115" y="236" style="fill:#fff">森</text>
    <text class="t" x="115" y="276" style="fill:#fff">수풀 삼</text>
    <text class="s" x="115" y="302" style="fill:#cfe6ff">세 그루면 빽빽한 숲</text>
  </g>
</svg>
