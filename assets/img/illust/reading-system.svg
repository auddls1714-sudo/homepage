  <rect x="150" y="330" width="122" height="90" rx="12" fill="#e8f1fb"/><text x="211" y="360" class="c" fill="#0066cc">LEVEL 1</text><text x="211" y="388" class="k" fill="#1d1d1f">EFR</text><text x="211" y="412" class="s" fill="#424245">즐겁게 읽기</text><rect x="280" y="280" width="122" height="140" rx="12" fill="#d6e7fa"/><text x="341" y="310" class="c" fill="#0066cc">LEVEL 2</text><text x="341" y="338" class="k" fill="#1d1d1f">MDR</text><text x="341" y="362" class="s" fill="#424245">정확하게 읽기</text><rect x="410" y="230" width="122" height="190" rx="12" fill="#c3dcf7"/><text x="471" y="260" class="c" fill="#0066cc">LEVEL 3</text><text x="471" y="288" class="k" fill="#1d1d1f">SDR</text><text x="471" y="312" class="s" fill="#424245">핵심 · 구조</text><rect x="540" y="180" width="122" height="240" rx="12" fill="#a9cdf3"/><text x="601" y="210" class="c" fill="#0066cc">LEVEL 4</text><text x="601" y="238" class="k" fill="#1d1d1f">TDR</text><text x="601" y="262" class="s" fill="#424245">추론 · 판단</text><rect x="670" y="130" width="122" height="290" rx="12" fill="#8dbcef"/><text x="731" y="160" class="c" fill="#0066cc">LEVEL 5</text><text x="731" y="188" class="k" fill="#1d1d1f">FDR</text><text x="731" y="212" class="s" fill="#424245">유창하게 읽기</text><rect x="800" y="80" width="122" height="340" rx="12" fill="#0066cc"/><text x="861" y="110" class="c" fill="#fff">LEVEL 6</text><text x="861" y="138" class="k" fill="#fff">LDR</text><text x="861" y="162" class="s" fill="#e6f0ff">교과 학습 적용</text>
