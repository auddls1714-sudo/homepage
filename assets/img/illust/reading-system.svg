<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="MDR 읽기 시스템: 읽기 능력 진단에서 시작해 EFR, MDR, SDR, TDR, FDR, LDR 6단계로 올라갑니다">
